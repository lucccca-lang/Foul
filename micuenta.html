<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cuenta - FOUL</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="page-cuenta">

    <header>
        <div class="header-container">
            <a href="index.html" class="logo-container">
                <img src="Imagenes/LogoPrincipal.png" alt="FOUL Logo" class="logo-img">
            </a>
            
            <div style="flex:1;"></div>

            <div class="header-actions">
                <a href="micuenta.html" class="header-btn" title="Mi Cuenta" style="text-decoration: none; background: #000; color: #fff;">👤</a>
                
            </div>
        </div>
    </header>

    <div class="breadcrumb">
       <a href="index.html">Inicio</a> > <span>Mi Cuenta</span>
    </div>

    <div class="account-container">
        
        <div class="form-tabs">
            <button class="tab-btn active" onclick="switchTab('login')">Iniciar Sesión</button>
            <button class="tab-btn" onclick="switchTab('register')">Crear Cuenta</button>
        </div>

        <form id="loginForm" class="auth-form active">
            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="ejemplo@email.com" required>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="submit-btn">Ingresar</button>
            <div class="form-footer">
                <p><a href="recuperar.html">¿Olvidaste tu contraseña?</a></p>
            </div>
        </form>

        <form id="registerForm" class="auth-form">
            <div class="form-group">
                <label>Nombre Completo</label>
                <input type="text" placeholder="Juan Pérez" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="ejemplo@email.com" required>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" placeholder="Crea una contraseña" required>
            </div>
            <div class="form-group">
                <label>Confirmar Contraseña</label>
                <input type="password" placeholder="Repite la contraseña" required>
            </div>
            <button type="submit" class="submit-btn">Crear Cuenta</button>
        </form>

    </div>

    <footer id="contacto">
        <img src=Imagenes/LogoAlternativo.png alt="FOUL" class="footer-logo">
        <p>&copy; 2025 FOUL - Todo el deporte en un mismo lugar</p>
        <p id="sucursales">📍 Condarco 5676, Buenos Aires, Argentina</p>
        <p>📞 <a href="tel:1162261362">11 6226-1362</a> |  <a href="mailto:foul@gmail.com">foul@gmail.com</a></p>
    </footer>

    <script>
       
        // Funcionalidad de las Pestañas (Login vs Registro)
        function switchTab(tabName) {
            // Obtener elementos
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const tabs = document.querySelectorAll('.tab-btn');

            // Resetear clases de las pestañas
            tabs.forEach(tab => tab.classList.remove('active'));

            // Lógica de cambio
            if (tabName === 'login') {
                loginForm.classList.add('active');
                registerForm.classList.remove('active');
                tabs[0].classList.add('active'); // Activa la primera pestaña
            } else {
                loginForm.classList.remove('active');
                registerForm.classList.add('active');
                tabs[1].classList.add('active'); // Activa la segunda pestaña
            }
        }
    </script>
</body>
</html>
