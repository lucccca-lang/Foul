<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cuenta - FOUL</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="page-cuenta">

    <header>
        <div class="header-container">
            <a href="index.html" class="logo-container">
                <img src="Imagenes/LogoPrincipal.png" alt="FOUL Logo" class="logo-img">
            </a>
            <div style="flex:1;"></div>

            <div class="header-actions">
                <a href="micuenta.html" class="header-btn activo" title="Mi Cuenta" aria-label="Mi Cuenta" aria-current="page"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a>
            </div>
        </div>
    </header>

    <nav class="breadcrumb" aria-label="Ruta de navegación">
       <a href="index.html">Inicio</a> > <span>Mi Cuenta</span>
    </nav>

    <div class="account-container">

        <h1 class="sr-only">Mi Cuenta</h1>
        <input type="radio" name="authTab" id="tabLogin" class="tab-radio" checked>
        <input type="radio" name="authTab" id="tabRegister" class="tab-radio">

        <div class="form-tabs">
            <label class="tab-btn" for="tabLogin">Iniciar Sesión</label>
            <label class="tab-btn" for="tabRegister">Crear Cuenta</label>
        </div>

        <form id="loginForm" class="auth-form">
            <div class="form-group">
                <label for="loginEmail">Email</label>
                <input id="loginEmail" autocomplete="email" type="email" placeholder="ejemplo@email.com" required>
            </div>
            <div class="form-group">
                <label for="loginPassword">Contraseña</label>
                <input id="loginPassword" autocomplete="current-password" type="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="submit-btn">Ingresar</button>
            <div class="form-footer">
                <p><a href="recuperar.html">¿Olvidaste tu contraseña?</a></p>
            </div>
        </form>

        <form id="registerForm" class="auth-form">
            <div class="form-group">
                <label for="regNombre">Nombre Completo</label>
                <input id="regNombre" autocomplete="name" type="text" placeholder="Juan Pérez" required>
            </div>
            <div class="form-group">
                <label for="regEmail">Email</label>
                <input id="regEmail" autocomplete="email" type="email" placeholder="ejemplo@email.com" required>
            </div>
            <div class="form-group">
                <label for="regPassword">Contraseña</label>
                <input id="regPassword" autocomplete="new-password" type="password" placeholder="Crea una contraseña" required>
            </div>
            <div class="form-group">
                <label for="regPassword2">Confirmar Contraseña</label>
                <input id="regPassword2" autocomplete="new-password" type="password" placeholder="Repite la contraseña" required>
            </div>
            <button type="submit" class="submit-btn">Crear Cuenta</button>
        </form>

    </div>

    <footer id="contacto">
        <img src="Imagenes/LogoAlternativo.png" alt="FOUL" class="footer-logo">
        <p>&copy; 2025 FOUL - Todo el deporte en un mismo lugar</p>
        <p id="sucursales">📍 Condarco 5676, Buenos Aires, Argentina</p>
        <p>📞 <a href="tel:1162261362">11 6226-1362</a> |  <a href="mailto:foul@gmail.com">foul@gmail.com</a></p>
    </footer>

</body>
</html>
